name: Build 达货爱vpn姑娘

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  Build-Frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Test and build frontend
        run: |
          cd frontend
          pnpm install --frozen-lockfile
          pnpm test
          pnpm build-only
      - uses: actions/upload-artifact@v6
        with:
          name: frontend-dist
          path: frontend/dist

  Build-Windows:
    needs: Build-Frontend
    runs-on: windows-latest
    env:
      APP_NAME: 达货爱vpn姑娘
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@latest
      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Build Windows amd64
        shell: pwsh
        run: |
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          Write-Host "==> Building Windows amd64..."
          & "$env:USERPROFILE/go/bin/wails.exe" build -m -s -trimpath -skipbindings -devtools -o "$env:APP_NAME.exe"
          if (-not (Test-Path "build/bin/$env:APP_NAME.exe")) { throw "exe was not produced" }
          Compress-Archive -Path "build/bin/$env:APP_NAME.exe" -DestinationPath "build/bin/$env:APP_NAME-windows-amd64.zip" -Force

      - uses: actions/upload-artifact@v6
        with:
          name: 达货爱vpn姑娘-windows-amd64
          path: build/bin/*.zip

  Release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [Build-Windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: release-assets/**/*.zip
          draft: false
          prerelease: ${{ contains(github.ref_name, 'dev') }}
          body: |
            Windows amd64 build of 达货爱vpn姑娘.
            Based on GUI.for.SingBox (GPL-3.0).
