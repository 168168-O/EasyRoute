name: Build 达货爱vpn姑娘

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  Build-Frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install sing-box 1.14.2
        run: |
          curl -fsSL -o /tmp/sing-box.tar.gz https://github.com/SagerNet/sing-box/releases/download/v1.14.2/sing-box-1.14.2-linux-amd64.tar.gz
          tar -xzf /tmp/sing-box.tar.gz -C /tmp
          sudo install -m 755 /tmp/sing-box-1.14.2-linux-amd64/sing-box /usr/local/bin/sing-box
          sing-box version
      - name: Test and build frontend
        run: |
          cd frontend
          pnpm install --frozen-lockfile
          pnpm test
          pnpm build-only
      - uses: actions/upload-artifact@v6
        with:
          name: frontend-dist
          path: frontend/dist

  Build-Windows:
    needs: Build-Frontend
    runs-on: windows-latest
    env:
      APP_NAME: 达货爱vpn姑娘
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@latest
      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Build Windows amd64
        shell: pwsh
        run: |
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          Write-Host "==> Building Windows amd64..."
          & "$env:USERPROFILE/go/bin/wails.exe" build -m -s -trimpath -skipbindings -devtools -o "$env:APP_NAME.exe"
          if (-not (Test-Path "build/bin/$env:APP_NAME.exe")) { throw "exe was not produced" }

          $singBoxVersion = "1.14.2"
          $assetName = "sing-box-$singBoxVersion-windows-amd64.zip"
          $downloadUrl = "https://github.com/SagerNet/sing-box/releases/download/v$singBoxVersion/$assetName"
          $headers = @{ "User-Agent" = "dhagn-release" }
          Write-Host "==> Bundling $assetName"
          $download = Join-Path $env:TEMP $assetName
          Invoke-WebRequest -Headers $headers -Uri $downloadUrl -OutFile $download
          $extract = Join-Path $env:TEMP "sing-box-extract"
          if (Test-Path $extract) { Remove-Item -Recurse -Force $extract }
          Expand-Archive -Path $download -DestinationPath $extract -Force
          $core = Get-ChildItem -Path $extract -Recurse -Filter "sing-box.exe" | Select-Object -First 1
          if (-not $core) { throw "sing-box.exe missing inside $assetName" }

          $stage = "build/bin/stage"
          if (Test-Path $stage) { Remove-Item -Recurse -Force $stage }
          New-Item -ItemType Directory -Force -Path "$stage/data/sing-box" | Out-Null
          Copy-Item "build/bin/$env:APP_NAME.exe" $stage
          Copy-Item $core.FullName "$stage/data/sing-box/sing-box.exe"
          $versionOutput = (& "$stage/data/sing-box/sing-box.exe" version | Out-String)
          Write-Host $versionOutput
          if ($versionOutput -notmatch 'sing-box version 1\.14\.2') { throw "bundled sing-box is not 1.14.2: $versionOutput" }
          if (Test-Path "build/bin/$env:APP_NAME-windows-amd64.zip") {
            Remove-Item -Force "build/bin/$env:APP_NAME-windows-amd64.zip"
          }
          Compress-Archive -Path "$stage/*" -DestinationPath "build/bin/$env:APP_NAME-windows-amd64.zip" -Force
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path "build/bin/$env:APP_NAME-windows-amd64.zip"))
          $names = @($zip.Entries | ForEach-Object { $_.FullName })
          $zip.Dispose()
          Write-Host ($names -join "`n")
          if (-not ($names | Where-Object { $_ -match 'sing-box\.exe' })) { throw "release zip is missing data/sing-box/sing-box.exe" }
          if (-not ($names | Where-Object { $_ -match [regex]::Escape($env:APP_NAME) })) { throw "release zip is missing the app exe" }

      - uses: actions/upload-artifact@v6
        with:
          name: 达货爱vpn姑娘-windows-amd64
          path: build/bin/*.zip

  Release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [Build-Windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: release-assets/**/*.zip
          draft: false
          prerelease: ${{ contains(github.ref_name, 'dev') }}
          body: |
            Windows amd64 build of 达货爱vpn姑娘.
            Based on GUI.for.SingBox (GPL-3.0).
